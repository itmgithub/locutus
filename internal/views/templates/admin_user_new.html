{{define "content"}}
<div class="panel narrow">
  <h1>{{t "admin.users.new"}}</h1>
  <form method="post" action="/admin/users/new" class="stacked">
    <input type="hidden" name="csrf" value="{{.CSRF}}">
    <label for="username">{{t "user.username"}}</label>
    <input type="text" id="username" name="username" value="{{.Data.Username}}" required autofocus>
    <label for="display_name">{{t "user.display_name"}}</label>
    <input type="text" id="display_name" name="display_name" value="{{.Data.DisplayName}}">
    <label for="email">{{t "user.email"}}</label>
    <input type="email" id="email" name="email" value="{{.Data.Email}}">
    <label for="password">{{t "user.password"}} <span class="hint">{{t "user.password_hint"}}</span></label>
    <input type="password" id="password" name="password" required autocomplete="new-password">
    <label for="role">{{t "user.role"}}</label>
    <select id="role" name="role">
      {{$role := .Data.Role}}
      <option value="" {{if eq $role ""}}selected{{end}}>{{t "role."}}</option>
      {{range .Data.Roles}}<option value="{{.}}" {{if eq $role .}}selected{{end}}>{{t (print "role." .)}}</option>{{end}}
    </select>
    <div class="form-actions">
      <button type="submit">{{t "common.create"}}</button>
      <a class="button secondary" href="/admin/users">{{t "common.cancel"}}</a>
    </div>
  </form>
</div>
{{end}}
